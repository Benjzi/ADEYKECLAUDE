    </style>
    <script>
      /* Returning visitors: start downloading the homepage hero image now,
         before the JS bundle loads (URL comes from the cached site settings). */
      (function () {
        try {
          if (location.pathname !== "/") return;
          var c = JSON.parse(localStorage.getItem("adeycp-settings-v1") || "null");
          var u = c && c.data && c.data.hero_slideshow && c.data.hero_slideshow[0];
          if (!u) return;
          // Skip if we've learned public URLs don't work here (private bucket).
          var off = +localStorage.getItem("adeycp-media-public-off") || 0;
          if (u.indexOf("/public/") > -1 && Date.now() - off < 20 * 60 * 1000) return;
          var l = document.createElement("link");
          l.rel = "preload"; l.as = "image"; l.href = u;
          l.setAttribute("fetchpriority", "high");
          var m = u.match(/([?&]width=)(\d+)/);
          if (m && u.indexOf("/render/image/public/") > -1) {
            // Same candidates MediaImage offers, so the preload matches the
            // image the browser will actually pick (no double download).
            var max = +m[2], ws = [480, 800, 1200, 1600].filter(function (w) { return w < max; }).concat(max);
            l.setAttribute("imagesrcset", ws.map(function (w) { return u.replace(/([?&]width=)\d+/, "$1" + w) + " " + w + "w"; }).join(", "));
            l.setAttribute("imagesizes", "100vw");
          }
          document.head.appendChild(l);
        } catch (e) {}
      })();
    </script>
    <title>Adey CP Humanitarian Association — Every Child Deserves to Thrive</title>

  <body>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("adeycp-dark-mode");
          var dark = stored !== null ? stored === "1" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          var root = document.documentElement;
          if (dark) root.classList.add("dark");
          root.style.colorScheme = dark ? "dark" : "light";
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", dark ? "#12162b" : "#123a5c");
        } catch (e) {}
      })();
    </script>
    <div id="root">
      <!--
        Shown instantly, before any JS has loaded/executed, so the tab is
        never blank-white while the app bundle downloads. React replaces
        this the moment it mounts.
      -->
      <div style="display:flex;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-family:system-ui,sans-serif;">
        <img src="/favicon-48x48.png" alt="" width="56" height="56" style="border-radius:9999px;animation:adey-pulse 1.4s ease-in-out infinite;" />
        <div style="height:4px;width:160px;overflow:hidden;border-radius:9999px;background:rgba(127,127,127,.25);">
          <div style="height:100%;width:33%;border-radius:9999px;background:#2b7fbf;animation:adey-bar 1.1s ease-in-out infinite;"></div>
        </div>
      </div>
      <style>
        @keyframes adey-pulse { 0%,100%{opacity:1} 50%{opacity:.45} }
        @keyframes adey-bar { 0%{transform:translateX(-120%)} 100%{transform:translateX(340%)} }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
